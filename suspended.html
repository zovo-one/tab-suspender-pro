<!DOCTYPE html>
<html lang="en" class="tsp-base">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark light">
    <title id="pageTitle">Tab Suspended</title>
    <link rel="icon" id="pageFavicon" type="image/x-icon" href="">
    <!-- Anti-flash: paint the paper (or the drawer) before any stylesheet arrives -->
    <style>
        html[data-theme="dark"] { background: #171411; }
        html:not([data-theme="dark"]) { background: #F6F0E4; }
    </style>
    <script src="theme-init.js"></script>
    <link rel="stylesheet" href="fonts.css">
    <link rel="stylesheet" href="design/tokens.css">
    <link rel="stylesheet" href="suspended.css">
</head>

<body>
    <svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true"><defs>
    <symbol id="restore" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"> <path d="M5 4h14"/> <path d="M4.5 8H17l3 3v8.5a1.5 1.5 0 0 1-1.5 1.5h-14A1.5 1.5 0 0 1 3 19.5v-10A1.5 1.5 0 0 1 4.5 8z"/> <path d="M11.5 17.5v-6M9 14l2.5-2.5L14 14"/> </symbol>
    <symbol id="whitelist" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"> <path d="M4.5 20A1.5 1.5 0 0 1 3 18.5v-13A1.5 1.5 0 0 1 4.5 4H10l1.5 3H18l3 3v8.5a1.5 1.5 0 0 1-1.5 1.5z"/> <path d="M8 13.5l2.5 2.5 5.5-5.5"/> </symbol>
    <symbol id="memory" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"> <path d="M3.5 8H18l2.5 2.5V16h-17z"/> <path d="M6.5 10.75v2.5M9.5 10.75v2.5M12.5 10.75v2.5"/> </symbol>
    <symbol id="timer" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"> <path d="M12 20a7 7 0 1 1 0-14 7 7 0 0 1 0 14z"/> <path d="M12 6V3.5M9.5 3.5h5M12 13V9.5M12 13l2.5 1.5"/> </symbol>
    <symbol id="moon-free" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"> <path d="M4.5 10 7 5h8l2 2 2.5 3z"/> <path d="M12 10v7M7 20h10M12 17h-2.5A1.5 1.5 0 0 0 8 18.5V20"/> </symbol>
    <symbol id="lamp-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"> <path d="M4.5 10 7 5h8l2 2 2.5 3z"/> <path d="M12 10v7M7 20h10M12 17h-2.5A1.5 1.5 0 0 0 8 18.5V20"/> <path d="M5 13.5l-1.5 1.5M19 13.5l1.5 1.5M12 1.5v1"/> </symbol>
    <symbol id="tab-sleeping" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"> <path d="M4.5 20A1.5 1.5 0 0 1 3 18.5v-13A1.5 1.5 0 0 1 4.5 4H10l1.5 3H18l3 3v8.5a1.5 1.5 0 0 1-1.5 1.5z"/> <path d="M7 14h2.5M12 14h2.5"/> </symbol>
    </defs></svg>

    <div class="suspended-container">
        <!-- Drawer label: who filed this card -->
        <header class="drawer-label">
            <span class="drawer-mark" aria-hidden="true">
                <svg width="22" height="22" viewBox="0 0 128 128"><path d="M28 0H92l36 36v64a28 28 0 0 1-28 28H28A28 28 0 0 1 0 100V28A28 28 0 0 1 28 0z" fill="#1F5C47"/><path d="M24 98a6 6 0 0 0 6 6h68a6 6 0 0 0 6-6V56L92 42H58l-6-12H30a6 6 0 0 0-6 6z" fill="#E6D7B8"/><path d="M40 74h30" stroke="#1F5C47" stroke-width="10" stroke-linecap="round"/></svg>
            </span>
            <span class="drawer-title">Tab Suspender Pro</span>
            <span class="drawer-state"><svg class="icon"><use href="#tab-sleeping"/></svg>Sleeping tab</span>
        </header>

        <!-- The index card: one card filed in the drawer, its tab still showing -->
        <main class="content">
            <article class="card" aria-labelledby="tabTitle">
                <div class="card-tab" aria-hidden="true"><span>Filed</span></div>

                <div class="tab-info">
                    <span class="favicon-frame">
                        <img id="favicon" class="favicon" src="" alt="" width="24" height="24">
                    </span>
                    <div class="tab-text">
                        <h1 id="tabTitle" class="tab-title">Loading...</h1>
                        <p id="tabUrl" class="tab-url"></p>
                    </div>
                </div>

                <dl class="stats">
                    <div class="stat">
                        <dt class="stat-label"><svg class="icon"><use href="#timer"/></svg>Sleeping for</dt>
                        <dd class="stat-value" id="timeSuspended">Just now</dd>
                    </div>
                    <div class="stat">
                        <dt class="stat-label"><svg class="icon"><use href="#memory"/></svg>Memory estimate</dt>
                        <dd class="stat-value" id="memorySaved">~50 MB</dd>
                    </div>
                </dl>

                <div class="restore-prompt">
                    <button type="button" class="restore-btn" id="restoreBtn">
                        <svg class="icon icon-20"><use href="#restore"/></svg>
                        Pull the card
                    </button>
                    <p class="restore-text">
                        <kbd>Enter</kbd> or <kbd>Space</kbd> restores. A click anywhere does too.
                    </p>
                </div>

                <a href="#" id="neverSuspendLink" class="never-suspend-link" role="button" title="Add this site to the whitelist and restore">
                    <svg class="icon"><use href="#whitelist"/></svg><span class="link-text">Never suspend this site</span>
                </a>
            </article>
            <div class="card-shadow card-shadow-1" aria-hidden="true"></div>
            <div class="card-shadow card-shadow-2" aria-hidden="true"></div>
        </main>

        <footer class="footer">
            <span class="footer-note">The page reloads from the web when you pull the card.</span>
            <a href="https://zovo.one" target="_blank" rel="noopener" class="branding">Made by Zovo</a>
        </footer>

        <!-- Theme toggle: the lamp. suspended.js shows .theme-icon-sun in dark and .theme-icon-moon in light -->
        <button class="theme-toggle" id="themeToggle" title="Switch theme" aria-label="Switch between light and dark theme">
            <svg class="theme-icon theme-icon-sun icon icon-20"><use href="#lamp-on"/></svg>
            <svg class="theme-icon theme-icon-moon icon icon-20"><use href="#moon-free"/></svg>
        </button>
    </div>

    <script src="suspended.js"></script>
</body>

</html>
